<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Lý Thuyết: AI Workflow</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .header-box { text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { display: block; width: 100%; padding: 12px; background: #3498db; color: #fff; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .question { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question h3 { margin-bottom: 15px; font-size: 16px; color: #34495e; }
        .option { display: block; margin-bottom: 10px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .option:hover { background: #f1f1f1; }
        .option input { margin-right: 10px; }
        #quiz-container, #result-container { display: none; }
        .result-box { text-align: center; padding: 30px; background: #e8f6f3; border-radius: 8px; border: 2px solid #1abc9c; }
        .result-box h2 { color: #1abc9c; font-size: 28px; margin-bottom: 10px; }
        .result-box p { font-size: 18px; }
        .loading { text-align: center; font-style: italic; color: #7f8c8d; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Phần 1: Nhập thông tin -->
    <div id="intro-container">
        <div class="header-box">
            <h1>Bài Kiểm Tra Lý Thuyết</h1>
            <p>Chuyên đề: Tổng quan & Xây dựng AI Workflow</p>
        </div>
        <div class="form-group">
            <label for="student-name">Vui lòng nhập Họ và Tên của bạn để bắt đầu:</label>
            <input type="text" id="student-name" placeholder="VD: Nguyễn Văn A" required>
        </div>
        <button id="start-btn">Bắt Đầu Làm Bài</button>
    </div>

    <!-- Phần 2: Nội dung câu hỏi -->
    <div id="quiz-container">
        <h2>Phần Trắc Nghiệm (10 Câu)</h2>
        <form id="quiz-form">
            <div id="questions-list"></div>
            <button type="submit" id="submit-btn">Nộp Bài & Xem Điểm</button>
            <div class="loading" id="loading-msg">Đang lưu kết quả của bạn... Vui lòng đợi!</div>
        </form>
    </div>

    <!-- Phần 3: Kết quả -->
    <div id="result-container">
        <div class="result-box">
            <h2>Hoàn Thành Xuất Sắc!</h2>
            <p>Cảm ơn <strong id="display-name"></strong> đã hoàn thành bài kiểm tra.</p>
            <p>Điểm số của bạn là: <strong id="display-score" style="font-size: 24px; color: #e74c3c;"></strong></p>
            <p style="margin-top: 20px; font-size: 14px; color: #7f8c8d;">Kết quả của bạn đã được ghi nhận vào hệ thống.</p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. CẤU HÌNH GOOGLE SHEETS WEB APP URL
    // ==========================================
    const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7vSh91q8Wk4HlMYPRX_eH53u_ICU93537pMHX_opRMnMiU-vlUKmxdB7MfcOFo7f2qA/exec"; 
    
    // ==========================================
    // 2. DỮ LIỆU CÂU HỎI THUẦN LÝ THUYẾT
    // ==========================================
    const questions = [
        {
            q: "Câu 1: Theo mô hình Contextual Prompting, cấu trúc R-G-I-O là viết tắt của những từ nào?",
            options: ["A. Role - Goal - Input - Output", "B. Rule - Goal - Idea - Output", "C. Role - Guide - Input - Option", "D. Rule - Guide - Input - Output"],
            ans: 0
        },
        {
            q: "Câu 2: Trong tư duy phân tích dữ liệu, khái niệm 'Inference' được hiểu là gì?",
            options: ["A. Sự thật hiển nhiên từ dữ liệu.", "B. Giả thuyết hoặc suy luận dựa trên dữ liệu.", "C. Quyết định hành động cuối cùng.", "D. Lỗi do hệ thống AI tạo ra."],
            ans: 1
        },
        {
            q: "Câu 3: Đâu là 3 cấp độ khai thác tài liệu (Document Intelligence) khi ứng dụng AI?",
            options: ["A. Đọc (Read) - Hiểu (Understand) - Viết (Write)", "B. Tóm tắt (Summary) - Trích xuất (Extraction) - Phân tích (Analysis)", "C. Tìm kiếm (Search) - Lọc (Filter) - Gộp (Merge)", "D. Dịch (Translate) - Tóm tắt (Summary) - Trình bày (Present)"],
            ans: 1
        },
        {
            q: "Câu 4: Framework đánh giá hợp đồng toàn diện bao gồm 4 yếu tố cốt lõi nào?",
            options: ["A. Cost, Risk, Cashflow, Liability", "B. Cost, Time, Cashflow, Quality", "C. Price, Speed, Risk, Legal", "D. Price, Margin, Cashflow, Liability"],
            ans: 0
        },
        {
            q: "Câu 5: Trong việc xây dựng AI Workflow, 'Custom Skill' được định nghĩa là gì?",
            options: ["A. Một câu lệnh (prompt) đơn giản dùng một lần.", "B. Một quy trình được chuẩn hóa sẵn để tái sử dụng nhiều lần.", "C. Một phần mềm quản lý cơ sở dữ liệu.", "D. Một công cụ vẽ biểu đồ tự động."],
            ans: 1
        },
        {
            q: "Câu 6: Cấu trúc tiêu chuẩn để đóng gói một Custom Skill (I-P-R-O) bao gồm các thành phần nào?",
            options: ["A. Input - Process - Rule - Output", "B. Idea - Process - Role - Output", "C. Input - Plan - Risk - Output", "D. Item - Process - Rule - Option"],
            ans: 0
        },
        {
            q: "Câu 7: Theo quy trình phân tích điểm bất thường (Outlier), 3 bước chuẩn cần thực hiện là gì?",
            options: ["A. Detect (Phát hiện) -> Verify (Xác minh) -> Explain (Giải thích)", "B. Detect (Phát hiện) -> Delete (Xóa bỏ) -> Report (Báo cáo)", "C. Find (Tìm kiếm) -> Guess (Phỏng đoán) -> Conclude (Kết luận)", "D. Ignore (Bỏ qua) -> Verify (Xác minh) -> Explain (Giải thích)"],
            ans: 0
        },
        {
            q: "Câu 8: Mô hình 3 thành phần cốt lõi để tạo nên một trợ lý số có cấu trúc bao gồm những gì?",
            options: ["A. Data, Hardware, Software", "B. Project (Knowledge), Skill (Process), Artifact (Output)", "C. Input, AI Model, Output", "D. Prompt, Context, Chatbot"],
            ans: 1
        },
        {
            q: "Câu 9: Quy trình chuẩn 4 bước (xương sống) của một AI Workflow là gì?",
            options: ["A. Tải file -> Đọc file -> Tóm tắt -> Lưu trữ", "B. Thu thập -> Phân tích -> Kiểm tra -> Xuất kết quả", "C. Tìm kiếm -> Lọc dữ liệu -> Gửi email -> Xóa file", "D. Nhập liệu -> Chạy AI -> Xóa lỗi -> Báo cáo"],
            ans: 1
        },
        {
            q: "Câu 10: Nguyên tắc 'Human-in-the-loop' trong vận hành AI Workflow nhấn mạnh điều gì?",
            options: ["A. AI không thể tự động hóa bất kỳ công việc nào.", "B. Con người phải nhập liệu thủ công toàn bộ dữ liệu.", "C. AI xử lý và phân tích, nhưng con người là người kiểm tra, phê duyệt và ra quyết định.", "D. Con người tính toán thủ công, AI chỉ dùng để trình bày báo cáo."],
            ans: 2
        }
    ];

    // ==========================================
    // 3. LOGIC XỬ LÝ GIAO DIỆN & LƯU ĐIỂM
    // ==========================================
    let studentName = "";

    document.getElementById('start-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('student-name').value.trim();
        if(nameInput === "") {
            alert("Vui lòng nhập họ tên của bạn trước khi bắt đầu!");
            return;
        }
        studentName = nameInput;
        document.getElementById('intro-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        renderQuestions();
    });

    function renderQuestions() {
        const list = document.getElementById('questions-list');
        questions.forEach((item, index) => {
            let html = `<div class="question">
                            <h3>${item.q}</h3>`;
            item.options.forEach((opt, optIndex) => {
                html += `<label class="option">
                            <input type="radio" name="q${index}" value="${optIndex}" required>
                            ${opt}
                         </label>`;
            });
            html += `</div>`;
            list.innerHTML += html;
        });
    }

    document.getElementById('quiz-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Tính điểm
        let score = 0;
        let answeredAll = true;

        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if(!selected) {
                answeredAll = false;
            } else if (parseInt(selected.value) === item.ans) {
                score += 1;
            }
        });

        if(!answeredAll) {
            alert("Vui lòng trả lời đầy đủ các câu hỏi!");
            return;
        }

        const finalScore = score + "/10";
        
        // Cập nhật giao diện
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('loading-msg').style.display = 'block';

        // Gửi dữ liệu thẳng lên Google Sheets
        fetch(GOOGLE_APP_SCRIPT_URL, {
            method: "POST",
            body: new URLSearchParams({
                "name": studentName,
                "score": finalScore
            })
        })
        .then(res => res.text())
        .then(data => {
            showResult(studentName, finalScore);
        })
        .catch(error => {
            alert("Có lỗi xảy ra khi lưu kết quả: " + error);
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('loading-msg').style.display = 'none';
        });
    });

    function showResult(name, score) {
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('display-name').innerText = name;
        document.getElementById('display-score').innerText = score;
    }
</script>

</body>
</html>
